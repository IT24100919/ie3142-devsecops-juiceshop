name: CI Pipeline

on:
  push:
    branches: [main, cicd-pipeline]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env

      - name: Build Juice Shop image
        run: |
          docker build -t juice-shop-local -f juice-shop-src/Dockerfile juice-shop-src

      - name: Confirm docker-compose file is valid
        run: |
          docker compose config

      - name: Build Docker image for scanning
        run: |
          docker build -t juice-shop-local:scan -f juice-shop-src/Dockerfile juice-shop-src

      # Trivy blocks the pipeline on CRITICAL vulnerabilities.
      # HIGH-severity transitive dependency findings and known
      # upstream JWT signing key usage are documented accepted
      # risks (see .trivyignore and --skip-files below), tracked
      # separately rather than blocking the release.
      # This is the assignment's required enforced blocking gate.
      - name: Run Trivy container scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivyignore:/.trivyignore" \
            aquasec/trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignorefile /.trivyignore \
            --skip-files "**/lib/insecurity.ts,**/build/lib/insecurity.js" \
            juice-shop-local:scan

      # Scoped to the four route/server files this team fixed
      # (SQLi in login and search, IDOR in basket, FTP exposure
      # in server.ts). Reports findings but does not block the
      # pipeline, Trivy above is this project's enforced blocking
      # gate. Findings are reviewed manually and documented in
      # the report's Secure Coding Evidence section.
      - name: Run Semgrep SAST scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/juice-shop-src:/src" \
            returntocorp/semgrep \
            semgrep --config=auto \
              /src/routes/login.ts \
              /src/routes/search.ts \
              /src/routes/basket.ts \
              /src/server.ts \
              --severity=ERROR || true

      - name: Run npm audit
        run: |
          cd juice-shop-src
          npm audit --audit-level=high || true

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary .env
        if: always()
        run: |
          rm -f .env
