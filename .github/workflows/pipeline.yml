name: CI Pipeline

on:
  push:
    branches: [main, cicd-pipeline]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env

      - name: Build Juice Shop image
        run: |
          docker build -t juice-shop-local -f juice-shop-src/Dockerfile juice-shop-src

      - name: Confirm docker-compose file is valid
        run: |
          docker compose config

      - name: Build Docker image for scanning
        run: |
          docker build -t juice-shop-local:scan -f juice-shop-src/Dockerfile juice-shop-src

      # Trivy blocks the pipeline on CRITICAL vulnerabilities.
      # HIGH-severity transitive dependency findings are documented
      # and tracked separately rather than blocking the release.
      # CVEs listed in .trivyignore are accepted risks in upstream
      # Juice Shop dependencies, documented in the report.
      - name: Run Trivy container scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivyignore:/.trivyignore" \
            aquasec/trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignorefile /.trivyignore \
            --skip-files "**/lib/insecurity.ts,**/build/lib/insecurity.js" \
            juice-shop-local:scan

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/juice-shop-src:/src" \
            returntocorp/semgrep \
            semgrep --config=auto /src --error

      - name: Run npm audit
        run: |
          cd juice-shop-src
          npm audit --audit-level=high

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary .env
        if: always()
        run: |
          rm -f .env
