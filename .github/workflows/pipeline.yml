name: CI Pipeline

on:
  push:
    branches: [main, cicd-pipeline, secrets-compliance]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" > .env

      - name: Build Juice Shop image
        run: docker build -t juice-shop-local -f juice-shop-src/Dockerfile juice-shop-src

      - name: Confirm docker-compose file is valid
        run: docker compose config

      - name: Remove temporary .env
        if: always()
        run: rm -f .env