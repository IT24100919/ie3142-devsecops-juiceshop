services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - juice-shop
    networks:
      - internal
      - public

networks:
  internal:
  public:
